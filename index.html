<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokbokki Order System</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #212529;
            --border: #e9ecef;
            --accent: #111111;
            --muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Menu Section */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 70px;
        }

        .menu-btn:hover {
            border-color: var(--accent);
        }

        .menu-btn .name {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .menu-btn .price {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Form Add Menu */
        .add-menu-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        input {
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Current Order Table */
        .order-table, .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .order-table th, .order-table td,
        .history-table th, .history-table td {
            text-align: left;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
        }

        .order-table th, .history-table th {
            color: var(--muted);
            font-weight: 500;
        }

        .qty-btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            width: 24px;
            height: 24px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pay-options {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }

        .pay-btn {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .pay-btn.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .total-display {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: right;
            margin-top: 12px;
        }

        .history-panel {
            grid-column: 1 / -1;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>Tokbokki Order System</h1>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-title">เลือกเมนู</div>
            
            <div class="menu-grid" id="menuGrid"></div>

            <div class="add-menu-form">
                <input type="text" id="newMenuName" placeholder="ชื่อเมนู">
                <input type="number" id="newMenuPrice" placeholder="ราคา">
                <button onclick="addMenuItem()">เพิ่ม</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">รายการสั่งซื้อ</div>
            
            <table class="order-table">
                <thead>
                    <tr>
                        <th>รายการ</th>
                        <th style="width: 80px; text-align: center;">จำนวน</th>
                        <th style="text-align: right;">รวม</th>
                    </tr>
                </thead>
                <tbody id="cartItems"></tbody>
            </table>

            <div class="total-display">
                รวมทั้งหมด: <span id="cartTotal">0</span> ฿
            </div>

            <div class="pay-options">
                <button class="pay-btn selected" id="btnCash" onclick="selectPayment('เงินสด')">เงินสด</button>
                <button class="pay-btn" id="btnTransfer" onclick="selectPayment('โอนเงิน')">โอนเงิน</button>
            </div>

            <button style="width: 100%; padding: 12px;" onclick="submitOrder()">บันทึกออเดอร์</button>
        </div>

        <div class="panel history-panel">
            <div class="panel-title">
                ประวัติออเดอร์
                <button onclick="clearHistory()" style="background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 0.8rem; padding: 4px 8px;">ล้างประวัติ</button>
            </div>
            
            <table class="history-table">
                <thead>
                    <tr>
                        <th style="width: 90px;">เวลา</th>
                        <th>รายการสินค้า</th>
                        <th style="width: 90px;">การชำระ</th>
                        <th style="width: 80px; text-align: right;">ยอดรวม</th>
                    </tr>
                </thead>
                <tbody id="historyItems"></tbody>
            </table>
        </div>
    </div>

    <script>
        // เริ่มต้นด้วยข้อมูลตัวอย่างเมนู
        let menus = JSON.parse(localStorage.getItem('tbk_menus')) || [
            { id: 1, name: 'ต็อกบกกีดั้งเดิม', price: 59 },
            { id: 2, name: 'ต็อกบกกีชีส', price: 79 },
            { id: 3, name: 'คิมมารี (3 ชิ้น)', price: 39 }
        ];

        let cart = [];
        let selectedPayment = 'เงินสด';
        let orderHistory = JSON.parse(localStorage.getItem('tbk_history')) || [];

        // แสดงผลรายการเมนู
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            menus.forEach(item => {
                grid.innerHTML += `
                    <div class="menu-btn" onclick="addToCart(${item.id})">
                        <div class="name">${item.name}</div>
                        <div class="price">${item.price} ฿</div>
                    </div>
                `;
            });
            localStorage.setItem('tbk_menus', JSON.stringify(menus));
        }

        // เพิ่มเมนูใหม่โดยผู้ใช้
        function addMenuItem() {
            const nameInput = document.getElementById('newMenuName');
            const priceInput = document.getElementById('newMenuPrice');
            
            if (!nameInput.value || !priceInput.value) return;

            menus.push({
                id: Date.now(),
                name: nameInput.value,
                price: parseFloat(priceInput.value)
            });

            nameInput.value = '';
            priceInput.value = '';
            renderMenu();
        }

        // จัดการตะกร้าสินค้า
        function addToCart(id) {
            const item = menus.find(m => m.id === id);
            const exist = cart.find(c => c.id === id);

            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartItems');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td style="text-align: center;">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            ${item.qty}
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </td>
                        <td style="text-align: right;">${itemTotal}</td>
                    </tr>
                `;
            });

            document.getElementById('cartTotal').innerText = total;
        }

        // เลือกช่องทางการชำระเงิน
        function selectPayment(type) {
            selectedPayment = type;
            document.getElementById('btnCash').classList.toggle('selected', type === 'เงินสด');
            document.getElementById('btnTransfer').classList.toggle('selected', type === 'โอนเงิน');
        }

        // บันทึกออเดอร์
        function submitOrder() {
            if (cart.length === 0) return;

            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const itemsSummary = cart.map(i => `${i.name} x${i.qty}`).join(', ');

            const order = {
                time: timeString,
                items: itemsSummary,
                payment: selectedPayment,
                total: total
            };

            orderHistory.unshift(order);
            localStorage.setItem('tbk_history', JSON.stringify(orderHistory));

            cart = [];
            renderCart();
            renderHistory();
        }

        // แสดงประวัติการสั่งซื้อ
        function renderHistory() {
            const tbody = document.getElementById('historyItems');
            tbody.innerHTML = '';

            orderHistory.forEach(order => {
                tbody.innerHTML += `
                    <tr>
                        <td>${order.time} น.</td>
                        <td>${order.items}</td>
                        <td><span class="badge">${order.payment}</span></td>
                        <td style="text-align: right; font-weight: 500;">${order.total} ฿</td>
                    </tr>
                `;
            });
        }

        function clearHistory() {
            if (confirm('ต้องการล้างประวัติออเดอร์ทั้งหมดหรือไม่?')) {
                orderHistory = [];
                localStorage.removeItem('tbk_history');
                renderHistory();
            }
        }

        // เริ่มต้นการทำงาน
        renderMenu();
        renderHistory();
    </script>
</body>
</html>
